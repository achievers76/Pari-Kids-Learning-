name: Build Pari Kids APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android files, Permissions & App Name
        run: |
          mkdir -p assets/lottie
          flutter create --platforms=android --project-name pari_kids .
          python3 -c 'p="android/app/src/main/AndroidManifest.xml"; s=open(p).read().replace("android:label=\"kids\"", "android:label=\"Pari Kids\"").replace("<application", "<uses-permission android:name=\"android.permission.INTERNET\"/>\n    <application", 1); open(p,"w").write(s)'

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pari-Kids-LKG-App
          path: build/app/outputs/flutter-apk/app-release.apk
          
